<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>NEXORA — Inteligência em escala planetária</title>
    <meta name="description" content="Uma experiência 3D imersiva guiada pelo scroll: da órbita ao asfalto, uma viagem contínua por satélites, cidades, data centers, chips quânticos, interfaces de IA e veículos autônomos." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="NEXORA — Inteligência em escala planetária" />
    <meta property="og:description" content="Uma experiência WebGL cinematográfica controlada pelo scroll, da órbita ao asfalto." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEXORA — Inteligência em escala planetária" />
    <meta name="twitter:description" content="Uma experiência WebGL cinematográfica controlada pelo scroll." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="webgl" aria-hidden="true"></canvas>
    <div class="dots-grid" aria-hidden="true"></div>

    <main id="experience" aria-label="Experiência NEXORA">
      <div id="text-layer"></div>
      <div id="label-layer" aria-hidden="true"></div>
      <div id="hud-layer" aria-hidden="true"></div>
    </main>

    <div class="band band-top" aria-hidden="true"></div>
    <div class="band band-bottom" aria-hidden="true"></div>
    <div id="credits" aria-live="polite"></div>

    <div id="ui"></div>
    <div id="cursor" aria-hidden="true"></div>
    <div id="fade" aria-hidden="true"></div>
    <div id="splash" role="dialog" aria-modal="true" aria-labelledby="splash-title"></div>
    <div id="sr-captions" class="sr-only" aria-live="polite"></div>

    <noscript>
      <div class="noscript">Esta experiência precisa de JavaScript habilitado.</div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
